<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무인화연구소 홈페이지 목업 안내</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--paper:#F1F1EC;--ink:#1A1E1A;--muted:#5b625a;--green:#2E5A3E;--green-deep:#213f2c;--lime:#C8F03C;--lime-deep:#b4e01f;--coral:#EF9A87;--coral-deep:#e5806a;--line:#e2e0d6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);background:var(--paper);line-height:1.65;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 22px}
.head{background:linear-gradient(158deg,#3E6B4A,#2E5A3E 52%,#213f2c);color:#fff;padding:64px 0 56px}
.head .eb{font-size:13px;font-weight:900;letter-spacing:.14em;color:var(--lime)}
.head h1{font-size:34px;font-weight:900;letter-spacing:-.03em;margin-top:12px;line-height:1.28}
.head p{color:#dceadb;font-size:16px;margin-top:14px;max-width:640px}
.head .meta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.head .meta span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700}
.sec{padding:52px 0 8px}
.sec h2{font-size:21px;font-weight:900;letter-spacing:-.02em}
.sec .sub{color:var(--muted);font-size:14.5px;margin-top:7px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px;display:flex;flex-direction:column;transition:.16s}
.card:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 12px 30px rgba(33,63,44,.1)}
.card .tag{display:inline-block;align-self:flex-start;font-size:11.5px;font-weight:900;letter-spacing:.06em;color:var(--coral-deep);border:1px solid var(--coral);border-radius:999px;padding:4px 11px}
.card h3{font-size:18.5px;font-weight:900;margin-top:12px;letter-spacing:-.02em}
.card p{color:var(--muted);font-size:14px;margin-top:8px;flex:1}
.card .go{margin-top:16px;display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:14px;color:var(--green)}
.card .go::after{content:"↗";font-size:13px}
.card.main{background:var(--green);border-color:var(--green);color:#fff}
.card.main .tag{color:var(--lime);border-color:rgba(200,240,60,.6)}
.card.main p{color:#cfe4cd}
.card.main .go{color:var(--lime)}
.note{margin:34px 0 0;background:#fff;border:1px solid var(--line);border-left:5px solid var(--lime-deep);border-radius:14px;padding:20px 22px}
.note h3{font-size:16px;font-weight:900}
.note ul{margin:10px 0 0 18px;color:var(--muted);font-size:14px}
.note li{margin:5px 0}
.foot{margin-top:52px;background:var(--green-deep);color:#c9d3c4;padding:30px 0;font-size:13.5px}
.foot b{color:#fff;display:block;font-size:15px;font-weight:900;margin-bottom:6px}
</style>
</head>
<body>

<header class="head">
  <div class="wrap">
    <div class="eb">MOCKUP HANDOVER</div>
    <h1>무인화연구소 홈페이지 목업</h1>
    <p>아래 링크를 눌러 각 페이지를 그대로 확인하실 수 있습니다.</p>
  </div>
</header>

<section class="sec">
  <div class="wrap">
    <h2>1. 무인화연구소 본사 사이트</h2>

    <div class="grid">
      <a class="card main" href="index.html">
        <span class="tag">MAIN</span>
        <h3>메인</h3>
        <span class="go">열어보기</span>
      </a>
    </div>
  </div>
</section>

<section class="sec">
  <div class="wrap">
    <h2>2. 창업 랜딩페이지</h2>

    <div class="grid">
      <a class="card main" href="https://parksy-creator.github.io/anding-studycafe-landing/" target="_blank" rel="noopener">
        <span class="tag">STUDY CAFE</span>
        <h3>앤딩스터디카페</h3>
        <span class="go">열어보기</span>
      </a>

      <a class="card main" href="앤딩워크라운지.html">
        <span class="tag">WORK LOUNGE</span>
        <h3>앤딩워크라운지</h3>
        <span class="go">열어보기</span>
      </a>
    </div>
  </div>
</section>

<footer class="foot">
  <div class="wrap">
    <b>(주)무인화연구소</b>

    문의 1811-9544 · biz@muinlab.io
  </div>
</footer>

</body>
</html>
